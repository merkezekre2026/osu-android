name: Build osu! Android APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install .NET Android Workload
        run: dotnet workload install android

      - name: Restore NuGet Packages
        run: dotnet restore osu.Android.slnf

      - name: Build Android App (Release Mode)
        run: |
          dotnet publish osu.Android/osu.Android.csproj -c Release -f net8.0-android -o ./build-output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: osu-android-apk
          path: ./build-output/*.apk
